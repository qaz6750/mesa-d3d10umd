name: Build the QCDX D3D10 UMD for ARM64

on:
  workflow_dispatch:
  push:
    branches: [qcdxkm8350]
  pull_request:
    branches: [qcdxkm8350]

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: amd64_arm64
      - name: Install build tools
        shell: pwsh
        run: |
          python -m pip install meson==1.7.2 ninja mako pyyaml packaging
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          choco install winflexbison3 -y --no-progress
      - name: Configure
        run: |
          meson setup build . --cross-file build-support/qcdxkm8350-arm64.ini --wrap-mode=nodownload 2>&1 | Tee-Object configure.log
          exit $LASTEXITCODE
      - name: Build the UMD
        run: |
          ninja -C build src/gallium/targets/d3d10umd/qcdx_d3d10.dll 2>&1 | Tee-Object build.log
          exit $LASTEXITCODE
      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mesa-logs
          path: |
            configure.log
            build.log
            build/meson-logs/meson-log.txt
      - uses: actions/upload-artifact@v4
        with:
          name: qcdx-umd-arm64
          if-no-files-found: error
          path: |
            build/src/gallium/targets/d3d10umd/qcdx_d3d10.dll
            build/src/gallium/targets/d3d10umd/qcdx_d3d10.pdb
