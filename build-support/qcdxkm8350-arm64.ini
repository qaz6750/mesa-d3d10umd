# Run from an x64-to-ARM64 Visual Studio developer prompt.
[binaries]
c = ['clang-cl', '--target=aarch64-pc-windows-msvc']
cpp = ['clang-cl', '--target=aarch64-pc-windows-msvc']
c_ld = 'lld-link'
cpp_ld = 'lld-link'
ar = 'llvm-lib'
windres = 'rc'

[host_machine]
system = 'windows'
cpu_family = 'aarch64'
cpu = 'aarch64'
endian = 'little'

[properties]
needs_exe_wrapper = true

[built-in options]
buildtype = 'release'
debug = true
b_vscrt = 'mt'
c_args = ['-Wno-error=int-conversion', '-Wno-error=incompatible-pointer-types']

[project options]
platforms = ['windows']
gallium-drivers = ['freedreno']
gallium-d3d10umd = true
gallium-d3d10-dll-name = 'qcdx_d3d10'
vulkan-drivers = []
zlib = 'disabled'
zstd = 'disabled'
llvm = 'disabled'
shader-cache = 'disabled'
shared-glapi = 'enabled'
gles1 = 'disabled'
gles2 = 'disabled'
opengl = false
build-tests = false
